<!DOCTYPE html>
<html lang="pt">
    <head>
        <title>IMC</title>
        <link href="styles/base.css" rel="stylesheet" type="text/css"/>
        <!-- mover o script para um arquivo separado

            4 - Coloque o link do arquivo AQUI, igual do CSS...

        <script>

            function calcularIMC(peso, altura){
                const imc = peso / (altura * altura);
                return imc;
            }

            function main(){
                // Passo 1 - Obter os dados peso e altura (informados pelo usuário)
                const p = document.getElementById("txtPeso").value;
                const a = document.getElementById("txtAltura").value;

                //console.log(a);
                //console.log(p);

                // Passo 2 - Verificar e Validar os dados
                // Tarefa para fazer em casa...

                // Passo 3 - Fazer o cálculo (chamando a função calcularIMC)
                const imcResultante = calcularIMC(p,a);

                // Passo 4 - Imprimir o resultado.
                console.log(imcResultante)
                // Tarefa: Além de imprimir o valor no console, como está acima,
                // mostrar na tela o valor para o usuário.
            }

        </script>
    </head>
    <body>
        <h1>Calcular IMC</h1>
        <p>Preencha todos os campos</p>
        <label for="txtAltura">Altura:</label>
        <p class="hint">(Em metros, usando ponto. Exemplos: 1.50, 1.77 etc)</p>
        <input id="txtAltura"
            type="text"
            required><br/><br/>
        <label for="txtPeso">Peso:</label><br/>
        <p class="hint">(Em kg, usando ponto ou não.
            Exemplos: 72.5, 90.5, 90.0 ou 90)</p>
        <input id="txtPeso"
            type="text"
            required><br/><br/>
        <button id="btnCalcularIMC" onclick="main();">Calcular</button>
    </body>
</html>
